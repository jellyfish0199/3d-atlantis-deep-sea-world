<canvas id="c" tabindex="0"></canvas>
<div id="vignette"></div>
<div id="ui">
  <div class="title"><div class="t1">亚特兰蒂斯 · 深海圣城</div><div class="t2">ATLANTIS · THE DEEP SANCTUM</div></div>
  <div class="panel tr">
    <div class="seg" id="modeSeg"><button data-mode="orbit" class="on">浏览</button><button data-mode="fp">漫游</button></div>
    <div class="rail" id="rail">
      <button class="icon" id="musicBtn" aria-label="音乐开关" title="音乐"><svg class="on-i"><use href="#i-note"/></svg><svg class="off-i"><use href="#i-mute"/></svg></button>
      <button class="icon" id="resetBtn" aria-label="复位视角" title="复位视角"><svg><use href="#i-reset"/></svg></button>
    </div>
  </div>
  <div class="panel bc">
    <div class="seg" id="timeSeg">
      <button data-t="morning" class="on">清晨</button><button data-t="dusk">黄昏</button><button data-t="night">夜晚</button><button data-t="storm">暴风雷雨</button>
    </div>
  </div>
  <div id="hint"></div>
  <aside id="guide">
    <button id="guideToggle" aria-expanded="false"><svg class="gi"><use href="#i-compass"/></svg><span>探索指引</span><svg class="chev"><use href="#i-chev"/></svg></button>
    <div id="guideBody">
      <div id="guideList">
        <button data-go="booth"><svg><use href="#i-phone"/></svg><span><b>神秘海底电话亭</b><small>拿起听筒，那头有人在等</small></span></button>
        <button data-go="garden"><svg><use href="#i-swing"/></svg><span><b>浪漫秋千</b><small>水晶珊瑚下，荡向蓝色河流</small></span></button>
        <button data-go="library"><svg><use href="#i-lib"/></svg><span><b>图书馆</b><small>推开圣殿大门，走进书海</small></span></button>
        <button data-go="book"><svg><use href="#i-book"/></svg><span><b>潮汐之书</b><small>一本会说话的古书</small></span></button>
        <button data-go="holo"><svg><use href="#i-holo"/></svg><span><b>人鱼全息虚影</b><small>点她，她会为你唱歌</small></span></button>
        <button data-go="pets"><svg><use href="#i-paw"/></svg><span><b>深海萌物随宠</b><small>广场两侧水池里的五只萌宠</small></span></button>
        <div class="chips" id="petChips"></div>
        <button data-go="statue"><svg><use href="#i-trident"/></svg><span><b>海神波塞冬雕像</b><small>广场中央的守护者</small></span></button>
        <button data-go="river"><svg><use href="#i-river"/></svg><span><b>梦幻河流</b><small>平时是蓝色 · 点河水换成粉色或极光</small></span></button>
        <div class="chips" id="riverChips"></div>
        <button data-go="shell0"><svg><use href="#i-shell"/></svg><span><b>秘密贝壳</b><small>敲开贝壳，带走一段记忆</small></span></button>
        <div class="chips" id="shellChips"></div>
        <button data-go="boat"><svg><use href="#i-boat"/></svg><span><b>猫糕小船</b><small>右边河上，三只猫糕在等你</small></span></button>
        <div class="chips" id="boatChips"></div>
      </div>
    </div>
  </aside>
  <div id="cross"></div>
  <div id="lockTip">点击画面锁定视角 · 也可按住拖拽环顾</div>
  <div id="prompt"></div>
  <div id="bubbles"></div>
  <button id="libExit" class="pill"><svg><use href="#i-exit"/></svg><span>回到门外大厅</span></button>
  <div id="joy"><div id="knob"></div></div>
  <div id="swingBar"><button class="pill" id="swingExit">离开秋千</button></div>
  <div id="shellCard" aria-hidden="true">
    <div class="sc-pop"><div class="sc-card" id="scTilt" title="点击图片保存到相册"><img id="scImg" alt="" draggable="false"><i class="sc-foil"></i><i class="sc-glare"></i></div></div>
    <div class="sc-cap"><b id="scTtl"></b><small id="scSub"></small></div>
    <div class="sc-row"><button class="pill" id="scSave">保存到相册</button><button class="pill" id="scClose">合上贝壳</button></div>
    <div class="sc-tip">晃一晃手机，或移动鼠标看看 · 点击图片即可保存</div>
    <div id="scToast"></div>
  </div>
  <div id="dlg">
    <div class="dlg-head"><span class="dot"></span><span class="ttl" id="dlgTtl">深海电话亭</span><button id="hang">挂断</button></div>
    <div id="dlgLog"></div>
    <div id="dlgOpts"></div>
    <div id="dlgInput"><textarea id="msg" rows="2" maxlength="200" placeholder="写下你想寄出去的心事……"></textarea><button id="send">寄出</button></div>
  </div>
</div>
<div id="loader">
  <div class="lt">亚特兰蒂斯 · 深海圣城</div><div class="ls">ATLANTIS · THE DEEP SANCTUM</div>
  <div class="track"><div id="ldBar"></div></div>
  <div class="lrow"><span id="ldTxt">正在潜入深海……</span><span id="ldPct">0%</span></div>
  <i class="bub" style="left:12%;animation-delay:-1s"></i><i class="bub" style="left:28%;animation-delay:-4s;width:5px;height:5px"></i><i class="bub" style="left:61%;animation-delay:-2.5s"></i><i class="bub" style="left:83%;animation-delay:-5s;width:6px;height:6px"></i>
</div>
